services:
  # Backend API (Python FastAPI)
  - type: web
    name: playweave-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: playweave-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false # Requires manual setup in Render Dashboard
      - key: FRONTEND_URL
        value: https://playweave-frontend.onrender.com # Will need to update with actual frontend URL

  # Frontend App (Static Site for better performance/cost)
  - type: web
    name: playweave-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://playweave-backend-efcm.onrender.com # Auto-links to the backend URL
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA routing

databases:
  - name: playweave-db
    databaseName: gamefinder
    plan: free
    region: oregon
